<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ClinicFlow Auth Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 640px; }
    input, button { padding: 8px; margin: 6px 0; width: 100%; }
    button { cursor: pointer; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>
  <h2>ClinicFlow Auth Test Harness</h2>

  <label>Email</label>
  <input id="email" value="admin@clinicflow.com" />

  <label>Password</label>
  <input id="password" type="password" value="admin123" />

  <button id="loginBtn">Login</button>
  <button id="meBtn">Check /auth/me</button>

  <h3>Result</h3>
  <pre id="out">Ready.</pre>

  <script>
    const out = document.getElementById('out');

    function show(label, status, data) {
      out.textContent = `${label}\nstatus: ${status}\n\n${JSON.stringify(data, null, 2)}`;
    }

    async function request(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      let data = null;
      try { data = await res.json(); } catch { data = { raw: await res.text() }; }
      return { status: res.status, data };
    }

    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { status, data } = await request('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      show('LOGIN', status, data);
    };

    document.getElementById('meBtn').onclick = async () => {
      const { status, data } = await request('/auth/me', { method: 'GET' });
      show('/auth/me', status, data);
    };
  </script>
</body>
</html>
